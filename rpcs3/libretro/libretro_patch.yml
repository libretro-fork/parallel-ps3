# Dark Souls: Prepare to Die Edition (EU disc, BLES01765): Unlock FPS for the executable RPCS3's patch.yml has
# no patch for (its own is for another build of the game, PPU-03679186..., and does nothing on this one)

PPU-d764d35ca136442f72228ab715a629f26994e641:
  "Unlock FPS":
    Games:
      "Dark Souls: Prepare to Die Edition":
        BLES01765: [ All ]
    Author: "Pappapatu (the patch for the other build), LibretroAdmin (this build; the bonfire watchdog after FPSFix, FPSFix+ and DS1-FPS-Unlock)"
    Notes: >-
      The game runs at 60 frames a second and moves by the time each frame took. The same two changes as the
      Unlock FPS of the other build of this game, found again in this executable: the game's own 60FPS(NO SKIP)
      flip mode set as it starts, and the fixed 1/30 s step replaced by the time since the last frame (4 ms to
      50 ms). Three numbers the movement code applies once a frame follow each frame's time too: the
      momentum kept in the air (so a roll or a walk off a ledge carries as far as at 30), ground friction and
      the pull down a slope. It also undoes the bonfire softlock, where after Reverse Hollowing or Kindle the
      character stays seated once the menu is closed: when the seated loop animation is still set a second
      after the bonfire's script has ended, the game's own stop of that animation is called. The code is in
      caves the patch engine allocates. Above about 95 frames a second a character that had been slowed
      against a wall stayed slow until the stick was let go: the game's test for "stuck" counts a frame's move
      as if frames were 1/30 s, so the small moves of short frames at half speed never passed it. The test
      and the rates it slows and recovers at go by the real frame time now. The kick and the jumping attack
      (forward with R1 or R2) need the stick to go from neutral to pushed between two frames; the stick now
      counts as having been neutral for 0.03 s after it leaves neutral, so short frames do not lose them. A
      roll goes the way the stick pointed over its last few values; those are now kept 0.03 s apart, as at 30
      frames a second, so a push let go just before the button still rolls that way. The same for the
      turn-around when a run is reversed: the stick's direction is compared with the one 0.03 s ago, not one
      short frame ago. Steering while sliding down a slope barely moved the character at a high frame rate
      (the turn's animation starts again every frame and the animation library scales down the movement of
      an animation that young); the mark it scales under follows the frame time.
    Patch Version: 1.10
