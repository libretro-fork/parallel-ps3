  "Disable Dynamic Exposure":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "Whatcookie (address), LibretroAdmin"
    Notes: >-
      Tone mapping keeps a fixed exposure instead of adapting to the scene: the debug menu's ToneMap switch
      (graphics manager byte 0x6EE) on from the start. Stops exposure flicker, and saves the GPU the exposure pass.
    Patch Version: 1.0
    Patch:
      - [ be16, 0x00025EDC, 0x981F ] # stb r0,0x6EE(r31) // r0 is 1 here; the retail code stores 0 from r29
  "Fixed Frame Pacing":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "LibretroAdmin"
    Notes: >-
      Needs "Unlock FPS" (alone it changes nothing). The game's time comes from the emulated vblank, not the host
      clock: each frame advances by the vblanks that passed since the last one, and waits for one vblank. Pacing is
      the same every run, with no catch-up jumps; a frame that takes too long advances two vblanks' time, so the
      game keeps its speed (up to Unlock FPS's 50 ms a frame). Choose 60 FPS, or 120 FPS with VBlank Frequency at
      "Auto" or 120: the frame rate chosen must be the VBlank Frequency.
    Configurable Values:
      "Frame Rate":
        Type: double_enum
        Value: 0.016666668
        Allowed Values:
          "60 FPS": 0.016666668
          "120 FPS (Vblank Rate 120)": 0.008333334
    Patch Version: 1.1
    Patch:
      # Unlock FPS's frame time routine at 0x016C7C30, written again: vblanks counted in place of host clock ticks
      - [ be32, 0x016C7C30, 0x3EC00185 ] # lis r22, 0x185 // r22 = 0x01852608, Unlock FPS's two words: the last count, the frame time
      - [ be32, 0x016C7C34, 0x3AD62608 ] # addi r22, r22, 0x2608
      - [ be32, 0x016C7C38, 0x3EA001B5 ] # lis r21, 0x1b5 // the game's vblank count (its vblank handler at 0x009F7018 adds 1 to 0x01B50434)
      - [ be32, 0x016C7C3C, 0x82B50434 ] # lwz r21, 0x434(r21)
      - [ be32, 0x016C7C40, 0x82760000 ] # lwz r19, 0(r22) // the count at the last frame
      - [ be32, 0x016C7C44, 0x92B60000 ] # stw r21, 0(r22)
      - [ be32, 0x016C7C48, 0x7E73A850 ] # subf r19, r19, r21 // vblanks since then
      - [ be32, 0x016C7C4C, 0x22530000 ] # subfic r18, r19, 0
      - [ be32, 0x016C7C50, 0x7E730194 ] # addze r19, r19 // none (two frames in one vblank) counts as one
      - [ be32, 0x016C7C54, 0xFA61FFF8 ] # std r19, -8(r1)
      - [ be32, 0x016C7C58, 0xCBC1FFF8 ] # lfd f30, -8(r1)
      - [ be32, 0x016C7C5C, 0xFFC0F69C ] # fcfid f30, f30
      - [ be32, 0x016C7C60, 0xC3B60004 ] # lfs f29, 4(r22) // the time of one vblank: "Frame Rate"
      - [ be32, 0x016C7C64, 0xEFFE0772 ] # fmuls f31, f30, f29
      - [ be32, 0x016C7C68, 0x3E40016C ] # lis r18, 0x16c // Unlock FPS's 50 ms limit, still at 0x016C7C88
      - [ be32, 0x016C7C6C, 0xC3927C88 ] # lfs f28, 0x7c88(r18)
      - [ be32, 0x016C7C70, 0xFF9FE000 ] # fcmpu cr7, f31, f28
      - [ be32, 0x016C7C74, 0x419C0008 ] # blt cr7, 0x16c7c7c
      - [ be32, 0x016C7C78, 0xFFE0E090 ] # fmr f31, f28
      - [ be32, 0x016C7C7C, 0xD3F60018 ] # stfs f31, 0x18(r22) // the frame time the game reads
      - [ be32, 0x016C7C80, 0x4E800020 ] # blr 
      - [ bef32, 0x0185260C, "Frame Rate" ] # the time of one vblank, in the low half of where Unlock FPS kept its last clock value
      - [ be32, 0x0002B8F8, 0x20A50001 ] # subfic r5,r5,1 // vblanks per flip: 1 in the 60 FPS mode Unlock FPS sets (it was 0, no wait), 2 in the retail 30 FPS one, as before
  "Shadow Map Size":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "LibretroAdmin"
    Notes: >-
      The game's shadow map size setting, read where an area's shadow camera is made: the debug menu's GAME REND >
      Shadow > "ShadwoMap Size", set as the game starts. The game's own is 2048; the debug menu stops there. The
      shadow filter is worked out from this number. Whether the shadow buffer itself grows past 2048 with it has
      not been seen yet: if shadows look wrong at 4096, go back to 2048.
    Configurable Values:
      "Size":
        Type: long_enum
        Value: 4096
        Allowed Values:
          "4096": 4096
          "3072": 3072
          "2048 (the game's)": 2048
          "1024": 1024
    Patch Version: 1.0
    Patch:
      - [ be32, 0x019D9C58, "Size" ] # the setting's starting value // Original 0x00000800
  "In-Game Debug Menu":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "gibbed (debug menu), LibretroAdmin"
    Notes: >-
      Select opens and closes the developers' debug menu in game: its pages (HG MAN graphics, MEM MAN, PERF MAN,
      Param Man, the character and camera pages and more) are built at boot in the retail game, but never drawn
      nor read. While it is open, the game does not take the pad. From gibbed's DemonsSoulsDebug, with stack frames
      of its own and absolute calls, in two code caves the patch engine allocates.
    Patch Version: 1.2
    Patch:
      # The debug memory zone, 2 MB in the retail game, at gibbed's 8 MB: the menu's nodes come from it, and with
      # a root node every area load adds its pages. At 2 MB the reload after a death ran out and the game crashed
      - [ be32, 0x0003A1FC, 0x3C600080 ] # lis r3, 0x80 // Original lis r3, 0x20
      - [ be32, 0x0003A244, 0x3CA00080 ] # lis r5, 0x80 // Original lis r5, 0x20
      - [ be32, 0x0003A2B0, 0x3CA00080 ] # lis r5, 0x80 // Original lis r5, 0x20
      # GAME REND > Shadow > "ShadwoMap Size" goes up to 4096 (512 to 2048 in steps of 256 as shipped; 2048 is the game's own setting)
      - [ be32, 0x0021CA8C, 0x38001000 ] # li r0, 0x1000 // Original li r0, 0x800: the menu entry's highest value
      # The menu built with a root node: in place of the call to create_debug_menu at 0x00020F44
      - [ calloc, 0x00020F46, 11 ] # Hook 0x00020F44 // Original bl 0x00015A58; returns to 0x00020F48
      - [ be32, 0x00000000, 0xF821FF81 ] # stdu r1, -0x80(r1)
      - [ be32, 0x00000000, 0xFBC10070 ] # std r30, 0x70(r1)
      - [ be32, 0x00000000, 0x48015A5B ] # bla 0x15a58
      - [ be32, 0x00000000, 0x7C7E1B78 ] # mr r30, r3
      - [ be32, 0x00000000, 0x8062948C ] # lwz r3, -0x6b74(r2)
      - [ be32, 0x00000000, 0x80638094 ] # lwz r3, -0x7f6c(r3)
      - [ be32, 0x00000000, 0x48406F0B ] # bla 0x406f08
      - [ be32, 0x00000000, 0x907E0004 ] # stw r3, 4(r30)
      - [ be32, 0x00000000, 0x7FC3F378 ] # mr r3, r30
      - [ be32, 0x00000000, 0xEBC10070 ] # ld r30, 0x70(r1)
      - [ be32, 0x00000000, 0x38210080 ] # addi r1, r1, 0x80
      # Drawn and read each frame: in place of the empty function at 0x00015A50 (a lone blr), called from 0x0001BB38
      - [ calloc, 0x00015A52, 124 ] # Hook 0x00015A50 // Original blr; returns with its own blr
      - [ be32, 0x00000000, 0x7C0802A6 ] # mflr r0
      - [ be32, 0x00000000, 0xF821FF41 ] # stdu r1, -0xc0(r1)
      - [ be32, 0x00000000, 0xF80100D0 ] # std r0, 0xd0(r1)
