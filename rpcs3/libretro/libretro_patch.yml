      - [ be32, 0x00000000, 0xC0093F30 ] # lfs f0, 0x3f30(r9)
      - [ be32, 0x00000000, 0xEC00082A ] # fadds f0, f0, f1 // not neutral: for how long (f1 is the frame time)
      - [ be32, 0x00000000, 0xD0093F30 ] # stfs f0, 0x3f30(r9)
      - [ be32, 0x00000000, 0x3C003CF5 ] # lis r0, 0x3cf5 // 0.03
      - [ be32, 0x00000000, 0x6000C28F ] # ori r0, r0, 0xc28f
      - [ be32, 0x00000000, 0x9001FF10 ] # stw r0, -0xf0(r1)
      - [ be32, 0x00000000, 0xC1A1FF10 ] # lfs f13, -0xf0(r1)
      - [ be32, 0x00000000, 0xFF806800 ] # fcmpu cr7, f0, f13
      - [ be32, 0x00000000, 0x38000000 ] # li r0, 0 // the game's: the byte is cleared
