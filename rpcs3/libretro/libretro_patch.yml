      - [ be32, 0x00000000, 0x3D800024 ] # lis r12, 0x24 // 0.03 s
      - [ be32, 0x00000000, 0x618C9F00 ] # ori r12, r12, 0x9f00
      - [ be32, 0x00000000, 0x7FA06040 ] # cmpld cr7, r0, r12
      - [ be32, 0x00000000, 0x419C000C ] # blt cr7, 0x28 // not yet: the same place again
      - [ be32, 0x00000000, 0x39290001 ] # addi r9, r9, 1 // the game's: the next place
      - [ be32, 0x00000000, 0x915D00E4 ] # stw r10, 0xe4(r29)
