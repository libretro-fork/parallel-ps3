      # ring at 0x70 of its object, the place written at 0x160, the length at 0x164) and the movement code plays the
      # turn-around when the direction swung more than 105 degrees since the older one (0x004C4F10): one frame, 1/30 s in the
      # game and 1/120 s at 120, where a quick reversal almost never swings that far. A new place in the ring is now taken
      # only when 0.03 s have passed since the last one (the timebase then is kept in the ring's unused last place, 0xe4 of
      # the object); until then the newest direction is written over
      - [ calloc, 0x004C69B6, 10 ] # Hook 0x004C69B4 // Original addi r9, r9, 1; returns to 0x004C69B8
      - [ be32, 0x00000000, 0x7D4C42E6 ] # mftb r10 // now, in 80,000,000ths of a second
      - [ be32, 0x00000000, 0x801D00E4 ] # lwz r0, 0xe4(r29)
      - [ be32, 0x00000000, 0x7C005050 ] # subf r0, r0, r10
