      - [ be32, 0x00000000, 0xC00C3F34 ] # lfs f0, 0x3f34(r12)
      - [ be32, 0x00000000, 0xEC00C82A ] # fadds f0, f0, f25
      - [ be32, 0x00000000, 0x3C003CF5 ] # lis r0, 0x3cf5 // 0.03
      - [ be32, 0x00000000, 0x6000C28F ] # ori r0, r0, 0xc28f
      - [ be32, 0x00000000, 0x900C3F38 ] # stw r0, 0x3f38(r12)
      - [ be32, 0x00000000, 0xC1AC3F38 ] # lfs f13, 0x3f38(r12)
      - [ be32, 0x00000000, 0xFF806800 ] # fcmpu cr7, f0, f13
      - [ be32, 0x00000000, 0x419C000C ] # blt cr7, 0x2c // not yet: the same place again
      - [ be32, 0x00000000, 0x39290001 ] # addi r9, r9, 1 // the game's: the next place
      - [ be32, 0x00000000, 0xEC000028 ] # fsubs f0, f0, f0
      - [ be32, 0x00000000, 0xD00C3F34 ] # stfs f0, 0x3f34(r12)
