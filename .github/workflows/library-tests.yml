  push:
    paths:
      - 'rpcs3/libretro/libretro-common/**'
      - 'rpcs3/libretro/tests/**'
      - 'rpcs3/Emu/Io/**'
      - 'rpcs3/Input/**'
      - 'rpcs3/Emu/Cell/Modules/cellPad.*'
      - 'rpcs3/Emu/Cell/Modules/cellGem.*'
      - 'rpcs3/Emu/Cell/Modules/cellAudio.*'
      - 'rpcs3/Emu/Cell/lv2/lv2.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_event.*'
      - 'rpcs3/Emu/Cell/lv2/sys_usbd.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_net/lv2_socket_p2ps.*'
      - 'rpcs3/Emu/RSX/RSXThread.*'
      - 'rpcs3/Emu/Io/Skylander.*'
      - 'rpcs3/Emu/Io/Infinity.*'
      - 'rpcs3/Emu/Io/Dimensions.*'
      - 'rpcs3/Emu/Io/KamenRider.*'
      - 'rpcs3/Emu/System.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_tty.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_timer.cpp'
      - 'rpcs3/Emu/Cell/Modules/cellVoice.*'
      - 'rpcs3/Emu/Cell/Modules/cellSysutil.cpp'
      - 'rpcs3/Emu/RSX/Overlays/**'
      - 'rpcs3/Emu/Cell/Modules/cellJpgDec_rows.*'
      - 'rpcs3/Emu/Cell/Modules/cellPngDec_rows.*'
      - 'rpcs3/Emu/RSX/Utils/rsx_scale.*'
      - 'rpcs3/Emu/Cell/Modules/cellVpost_conv.*'
      - 'rpcs3/Emu/Cell/Modules/cellAtracXdec_pcm.*'
      - 'rpcs3/Emu/Cell/Modules/cellVdec_codec.*'
      - 'rpcs3/util/media_decode.*'
      - 'rpcs3/util/media_encode.*'
      - 'rpcs3/libretro/config_database.*'
      - 'rpcs3/libretro/vblank_list.*'
      - 'rpcs3/libretro/vblank_unlock.txt'
      - 'rpcs3/libretro/config_database.dat'
      - 'rpcs3/util/video_sink.h'
      - 'rpcs3/Emu/RSX/VK/vkutils/libretro_images.h'
      - 'rpcs3/libretro/libretro_sw_frames.*'
      - 'rpcs3/libretro/*.c'
      - 'rpcs3/libretro/*.cpp'
      - 'rpcs3/libretro/*.h'
      - 'rpcs3/Emu/RSX/VK/VKLibretro.*'
      - 'rpcs3/libretro/libretro_gl_frames.*'
      - 'rpcs3/libretro/libretro_gl_fallback.*'
      - '3rdparty/GL/**'
      - 'rpcs3/Emu/RSX/Overlays/overlay_font_pack.h'
      - 'rpcs3/Emu/NP/pb_wire.h'
      - 'rpcs3/Emu/NP/generated/**'
      - '.github/workflows/library-tests.yml'
  pull_request:
    paths:
      - 'rpcs3/libretro/libretro-common/**'
      - 'rpcs3/libretro/tests/**'
      - 'rpcs3/Emu/Io/**'
      - 'rpcs3/Input/**'
      - 'rpcs3/Emu/Cell/Modules/cellPad.*'
      - 'rpcs3/Emu/Cell/Modules/cellGem.*'
      - 'rpcs3/Emu/Cell/Modules/cellAudio.*'
      - 'rpcs3/Emu/Cell/lv2/lv2.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_event.*'
      - 'rpcs3/Emu/Cell/lv2/sys_usbd.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_net/lv2_socket_p2ps.*'
      - 'rpcs3/Emu/RSX/RSXThread.*'
      - 'rpcs3/Emu/Io/Skylander.*'
      - 'rpcs3/Emu/Io/Infinity.*'
      - 'rpcs3/Emu/Io/Dimensions.*'
      - 'rpcs3/Emu/Io/KamenRider.*'
      - 'rpcs3/Emu/System.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_tty.cpp'
      - 'rpcs3/Emu/Cell/lv2/sys_timer.cpp'
      - 'rpcs3/Emu/Cell/Modules/cellVoice.*'
      - 'rpcs3/Emu/Cell/Modules/cellSysutil.cpp'
      - 'rpcs3/Emu/RSX/Overlays/**'
      - 'rpcs3/Emu/Cell/Modules/cellJpgDec_rows.*'
      - 'rpcs3/Emu/Cell/Modules/cellPngDec_rows.*'
      - 'rpcs3/Emu/RSX/Utils/rsx_scale.*'
      - 'rpcs3/Emu/Cell/Modules/cellVpost_conv.*'
      - 'rpcs3/Emu/Cell/Modules/cellAtracXdec_pcm.*'
      - 'rpcs3/Emu/Cell/Modules/cellVdec_codec.*'
      - 'rpcs3/util/media_decode.*'
      - 'rpcs3/util/media_encode.*'
      - 'rpcs3/libretro/config_database.*'
      - 'rpcs3/libretro/vblank_list.*'
      - 'rpcs3/libretro/vblank_unlock.txt'
      - 'rpcs3/libretro/config_database.dat'
      - 'rpcs3/util/video_sink.h'
      - 'rpcs3/Emu/RSX/VK/vkutils/libretro_images.h'
      - 'rpcs3/libretro/libretro_sw_frames.*'
      - 'rpcs3/libretro/*.c'
      - 'rpcs3/libretro/*.cpp'
      - 'rpcs3/libretro/*.h'
      - 'rpcs3/Emu/RSX/VK/VKLibretro.*'
      - 'rpcs3/libretro/libretro_gl_frames.*'
      - 'rpcs3/libretro/libretro_gl_fallback.*'
      - '3rdparty/GL/**'
      - 'rpcs3/Emu/RSX/Overlays/overlay_font_pack.h'
      - 'rpcs3/Emu/NP/pb_wire.h'
      - 'rpcs3/Emu/NP/generated/**'
      - '.github/workflows/library-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    name: Library replacement tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      # The reference tools read back what the new code writes (FFmpeg
      # cellRec's recordings: rec_check.sh). libpng,
      # the oracle the PNG conversions are checked against, is 1.6.59 as
      # RPCS3 built it, and stb, the oracle for the image decoders and the
      # font rasterizer, the commit RPCS3 pinned: the Makefile fetches them
      # (zlib for libpng)
      # Mesa's EGL and software OpenGL, for the OpenGL renderer's frames to
      # the frontend (test_gl_frames)
      - name: Reference tools
        run: sudo apt-get update -q && sudo apt-get install -y -q zstd zlib1g-dev ffmpeg libegl-dev libegl-mesa0 libgl1-mesa-dri

      - name: Run
        run: make -C rpcs3/libretro/tests -j"$(nproc)" check

      # The modules with a NEON path, as ARM64 under emulation
      - name: ARM64 under emulation
        run: |
          sudo apt-get install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          make -C rpcs3/libretro/tests check-arm64

      # The RPCN client's TLS connection, read and written from two threads
      # at once, again under ThreadSanitizer
      - name: TLS duplex under ThreadSanitizer
        run: |
          make -C rpcs3/libretro/tests clean
          make -C rpcs3/libretro/tests -j"$(nproc)" SANITIZE='-fsanitize=thread -fno-omit-frame-pointer' test_tls_duplex
          cd rpcs3/libretro/tests
          TSAN_OPTIONS=halt_on_error=1 setarch "$(uname -m)" -R ./tls_duplex_test.sh ./test_tls_duplex
