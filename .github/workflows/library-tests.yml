name: Library replacement tests

# The libretro-common pieces that replaced third-party libraries, against
# data the old libraries wrote, under AddressSanitizer and
# UndefinedBehaviorSanitizer. Seconds, not a core build.
on:
  push:
    paths:
      - 'rpcs3/libretro/libretro-common/**'
      - 'rpcs3/libretro/tests/**'
      - '.github/workflows/library-tests.yml'
  pull_request:
    paths:
      - 'rpcs3/libretro/libretro-common/**'
      - 'rpcs3/libretro/tests/**'
      - '.github/workflows/library-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    name: Library replacement tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      # The reference tools read back what the new code writes
      - name: Reference tools
        run: sudo apt-get install -y -q zstd

      - name: Run
        run: make -C rpcs3/libretro/tests -j"$(nproc)" check
