name: Build libretro core

defaults:
  run:
    shell: bash

# Test builds only, started by hand. The core is nowhere near ready to be
# published on every push, and a full RPCS3 build is not something to spend a
# runner on unless someone asked for it.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all
      keep_symbols:
        description: 'Leave the symbol table in the core (for backtraces)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}-libretro
  cancel-in-progress: true

env:
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  Build:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            docker_img: "rpcs3/rpcs3-ci-jammy:2.1"
          - os: ubuntu-24.04-arm
            arch: aarch64
            docker_img: "rpcs3/rpcs3-ci-jammy-aarch64:2.1"
    name: libretro core ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      ARTDIR: "/root/artifacts"
      COMPILER: clang
      # Passed into the container through .ci/docker.env; the build script
      # skips its strip when this is 1, so gdb has names to walk.
      KEEP_SYMBOLS: ${{ inputs.keep_symbols && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore build Ccache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-

      - name: Docker setup and build
        run: |
          mkdir -p "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}" "${{ env.CCACHE_DIR }}"
          docker pull --quiet ${{ matrix.docker_img }}
          docker run \
            -v $PWD:/rpcs3 \
            --env-file .ci/docker.env \
            -v ${{ env.CCACHE_DIR }}:/root/.ccache \
            -v ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}:${{ env.ARTDIR }} \
            ${{ matrix.docker_img }} \
            /rpcs3/.ci/build-libretro.sh

      - name: Name the core after the architecture it is for
        run: |
          cd "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          mv parallel_ps3_libretro.so parallel_ps3_libretro_linux_${{ matrix.arch }}.so

      # A core is loaded by a frontend on a machine nobody here picked, so what
      # it needs by soname decides whether it loads at all. The first build to
      # go out wanted libGLEW.so.2.2 and would not load on a distribution that
      # ships a different one, and nothing in the build said so - it only turned
      # up when someone tried it. List them here, and fail on the ones that are
      # ours to carry rather than the system's to provide.
      - name: Report what the core needs at load time
        run: |
          cd "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          readelf -d parallel_ps3_libretro_linux_${{ matrix.arch }}.so | grep NEEDED
          if readelf -d parallel_ps3_libretro_linux_${{ matrix.arch }}.so | grep -qE 'NEEDED.*(libGLEW|libopencv|libvulkan)'; then
            echo "::error::the core still needs a library the build image provided but a user's system will not"
            exit 1
          fi
          # No GL library and no window system: the frontend owns the window
          # and gives the core its GL functions, so none of their libraries
          # may be needed and none of their functions left for the loader.
          if readelf -d parallel_ps3_libretro_linux_${{ matrix.arch }}.so | grep -qE 'NEEDED.*(libX11|libGLX|libGL|libOpenGL|libEGL|libxcb|libwayland)'; then
            echo "::error::the core needs a GL or window system library to load"
            exit 1
          fi
          if nm -D --undefined-only parallel_ps3_libretro_linux_${{ matrix.arch }}.so | grep -E ' (gl[A-Z]|egl[A-Z]|X[A-Z][a-z]|glX|xcb_|wl_)'; then
            echo "::error::the core has GL or window system functions left for the loader"
            exit 1
          fi

      # The core info file goes with every core: a test build's core can take content types the published .info does
      # not list yet, and the frontend's file browser goes by the .info (NNshi).
      - name: Add the core info file
        run: cp rpcs3/libretro/parallel_ps3_libretro.info "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: parallel_ps3_libretro-linux-${{ matrix.arch }}
          path: |
            ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/*.so
            ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/*.info
          compression-level: 0

      - name: Save build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

  Windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    # Experimental, and allowed to fail. Built under MSYS2's clang64 rather
    # than MSVC: the core exists only as a CMake target, so rpcs3.sln - the way
    # upstream builds Windows - is no use, and CMake with MSVC gets no further
    # because the LLVM on the runner image is the client distribution, with no
    # CMake package and no static libraries for find_package(LLVM) to find.
    # clang64 ships all of that as packages, which is the same environment
    # .ci/build-windows-clang.sh already uses for the application.
    name: libretro core windows-x64 (experimental)
    runs-on: windows-2025
    continue-on-error: true
    env:
      KEEP_SYMBOLS: ${{ inputs.keep_symbols && '1' || '0' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          cache: true
          install: |
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-opencv
            base-devel
            git
            p7zip

      - name: Build
        run: .ci/build-windows-clang-libretro.sh

      - name: Add the core info file
        shell: bash
        run: cp rpcs3/libretro/parallel_ps3_libretro.info artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: parallel_ps3_libretro-windows-x86_64
          path: |
            artifacts/*.dll
            artifacts/*.info
          compression-level: 0

  Android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    # Experimental, and allowed to fail, like Windows. Android is reachable in
    # principle - 3rdparty/llvm/CMakeLists.txt has an if(ANDROID) branch that
    # builds LLVM for AArch64 with an Android triple - but cross-building LLVM
    # is far larger than the core it serves and does not belong in a test run.
    # LLVM is built from the sources in the repository here, for the ABI being built - the
    # branch for that is already in 3rdparty/llvm/CMakeLists.txt, AArch64 on
    # arm64 and X86 on x86_64. Skipping it was the plan
    # and did not survive contact: the AArch64 CPU backend uses llvm:: types
    # whether or not WITH_LLVM is set, so there is no arm64 build without it.
    #
    # What this answers is whether the core compiles for Android at all. Even
    # when it does, nobody should expect to play on it.
    name: libretro core android-${{ matrix.name }} (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            abi: arm64-v8a
          - name: x86_64
            abi: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      # Everything, LLVM included. It cannot be left out after all: the AArch64
      # CPU backend is compiled for every arm64 target and uses llvm:: types
      # without asking whether WITH_LLVM is on, so an arm64 build without LLVM
      # does not compile. Nothing ships a prebuilt LLVM for Android either, so
      # it gets built here - the long pole in this job by a wide margin.
      - name: Fetch the submodules the build uses
        run: |
          git config --global --add safe.directory '*'
          git submodule -q update --init --depth 1 \
            $(awk '/path/ { print $3 }' .gitmodules)

      - name: Configure
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK at $NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=ON \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_LTO=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_SYSTEM_OPENAL=OFF

      - name: Build
        run: cmake --build build --target rpcs3_libretro

      - name: Collect
        run: |
          mkdir -p artifacts
          find build -name 'parallel_ps3_libretro.so' -exec cp {} artifacts/parallel_ps3_libretro_android_${{ matrix.name }}.so \;
          ls -la artifacts
          # A gigabyte of it is debug information. The NDK toolchain file puts
          # -g in the flags for every build type and nothing takes it back out,
          # so the first Android core to link came out at 1027 MB next to 54 MB
          # for the same thing on Linux aarch64 - which is not a file anyone is
          # going to put on a phone. Strip it, and print both sizes so a core
          # that starts arriving unstripped again says so in the log.
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -x "$STRIP" ]; then STRIP="$(command -v llvm-strip || command -v strip)"; fi
          echo "before: $(stat -c %s artifacts/parallel_ps3_libretro_android_${{ matrix.name }}.so) bytes"
          "$STRIP" --strip-unneeded artifacts/parallel_ps3_libretro_android_${{ matrix.name }}.so
          echo "after:  $(stat -c %s artifacts/parallel_ps3_libretro_android_${{ matrix.name }}.so) bytes"
          ls -la artifacts

      - name: Add the core info file
        run: cp rpcs3/libretro/parallel_ps3_libretro.info artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: parallel_ps3_libretro-android-${{ matrix.name }}
          path: |
            artifacts/*.so
            artifacts/*.info
          compression-level: 0

  MacOS:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    # As upstream's macOS build, with LLVM's own clang rather than Apple's:
    # Apple clang does not take fmt::throw_exception's [[noreturn]] constructor
    # as the end of a function, and -Werror=return-type fails all over. Clang,
    # the LLVM the core links from Homebrew, and Vulkan
    # through the MoltenVK RetroArch carries, opened at run time.
    # Each architecture on its own runner, so Homebrew's libraries are its own.
    name: libretro core macos-${{ matrix.arch }} (experimental)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Submodules
        run: git submodule -q update --init --depth 1 $(awk '/path/ && !/llvm/ && !/opencv/ && !/libsdl-org/ { print $3 }' .gitmodules)

      - name: Dependencies
        run: |
          brew install ninja llvm@21 >/dev/null
          echo "LLVM=$(brew --prefix llvm@21)" >> $GITHUB_ENV
          echo "BREW=$(brew --prefix)" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$LLVM/bin/clang -DCMAKE_CXX_COMPILER=$LLVM/bin/clang++ \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_PREFIX_PATH="$BREW" \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DWITH_LLVM=ON -DBUILD_LLVM=OFF -DSTATIC_LINK_LLVM=ON -DLLVM_DIR=$LLVM/lib/cmake/llvm \
            -DUSE_NATIVE_INSTRUCTIONS=OFF -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SYSTEM_OPENCV=OFF -DUSE_LTO=OFF

      - name: Build
        run: cmake --build build --target rpcs3_libretro

      - name: Collect
        run: |
          mkdir -p artifacts
          f=$(find build -name 'parallel_ps3_libretro.dylib' | head -1)
          CORE=artifacts/parallel_ps3_libretro_macos_${{ matrix.arch }}.dylib
          cp "$f" $CORE
          strip -x $CORE
          # Nothing from Homebrew at its own path: zstd (LLVM's) goes next
          # to the core. MoltenVK is not linked: volk opens the one RetroArch
          # carries at run time
          if otool -L $CORE | grep -q -i 'vulkan\|MoltenVK'; then echo "the core links Vulkan"; exit 1; fi
          ZSTD=$(otool -L $CORE | awk '/libzstd/ {print $1}')
          if [ -n "$ZSTD" ]; then
            # One per architecture, named after it, so the two never meet
            Z=libzstd_macos_${{ matrix.arch }}.dylib
            cp "$ZSTD" artifacts/$Z
            chmod u+w artifacts/$Z
            install_name_tool -id @loader_path/$Z artifacts/$Z
            install_name_tool -change "$ZSTD" @loader_path/$Z $CORE
            codesign -f -s - artifacts/$Z
          fi
          codesign -f -s - $CORE
          cp rpcs3/libretro/parallel_ps3_libretro.info artifacts/
          otool -L $CORE
          if otool -L $CORE | grep -q '/opt/homebrew\|/usr/local/'; then echo "still linked to Homebrew"; exit 1; fi
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: parallel_ps3_libretro-macos-${{ matrix.arch }}
          path: |
            artifacts/*.dylib
            artifacts/*.info
          compression-level: 0
