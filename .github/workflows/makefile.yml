name: Makefile build

# The core built with the Makefile instead of CMake (Linux x86_64, GCC, LLVM
# built from the sources in the repository into the core), then
# loaded with every symbol resolved and asked what it is, and in-memory save
# states written and read through RPCS3's serializer (make check).
on:
  push:
    paths:
      - 'Makefile'
      - 'Makefile.common'
      - 'rpcs3/libretro/make/**'
      - '.gitmodules'
      - 'rpcs3/libretro/tests/test_savestate_memory.cpp'
      - 'rpcs3/libretro/tests/test_decoders.cpp'
      - 'rpcs3/Emu/savestate_utils.*'
      - 'rpcs3/Emu/System.cpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/makefile.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'Makefile.common'
      - 'rpcs3/libretro/make/**'
      - '.gitmodules'
      - 'rpcs3/libretro/tests/test_savestate_memory.cpp'
      - 'rpcs3/libretro/tests/test_decoders.cpp'
      - 'rpcs3/Emu/savestate_utils.*'
      - 'rpcs3/Emu/System.cpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/makefile.yml'
  workflow_dispatch:

jobs:
  makefile:
    # Also without LLVM, as a build finds itself where there is no LLVM to
    # link: the interpreters take the place of the LLVM recompilers
    # (test_decoders), where a game stopped at its first PPU module
    name: Makefile build (Linux x86_64${{ matrix.llvm == '0' && ', no LLVM' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        llvm: ['1', '0']
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Submodules
        run: git submodule -q update --init --depth 1 $(awk '/path/ && !/llvm/ && !/opencv/ && !/libsdl-org/ { print $3 }' .gitmodules)

      - name: Dependencies
        run: sudo apt-get install -y -q zlib1g-dev unzip libvulkan1 mesa-vulkan-drivers >/dev/null

      # LLVM from the sources in the repository (3rdparty/llvm/llvm), built
      # by the Makefile into the core. Its objects and TableGen's output are
      # kept between runs: they change only with those sources or the lists
      # and headers they are built from.
      - name: LLVM objects
        if: matrix.llvm == '1'
        uses: actions/cache@v4
        with:
          path: rpcs3/libretro/generated/llvm
          key: llvm-objects-${{ hashFiles('3rdparty/llvm/**', 'rpcs3/libretro/make/llvm/**') }}-${{ github.sha }}
          restore-keys: llvm-objects-${{ hashFiles('3rdparty/llvm/**', 'rpcs3/libretro/make/llvm/**') }}-

      - name: Build
        run: make -j"$(nproc)" HAVE_LLVM=${{ matrix.llvm }}

      # Nothing to install for OpenGL or Vulkan, and no library of theirs or
      # of a window system needed by the core: GL comes from the frontend,
      # Vulkan is opened at run time
      - name: Libraries
        run: |
          readelf -d parallel_ps3_libretro.so | grep NEEDED
          if readelf -d parallel_ps3_libretro.so | grep -qE 'NEEDED.*(libvulkan|libGLEW|libGL|libOpenGL|libEGL|libX11|libxcb|libwayland)'; then exit 1; fi
          if nm -D --undefined-only parallel_ps3_libretro.so | grep -E ' (gl[A-Z]|egl[A-Z]|glX|wgl|X[A-Z][a-z]|xcb_|wl_)'; then exit 1; fi

      # glslang is not in the tree any more: test_shader_corpus holds rslc's
      # modules to glslang's when it is given one, so one is built here, at
      # the commit the core last had
      - name: Reference glslang
        if: matrix.llvm == '1'
        run: |
          git init -q "$RUNNER_TEMP/glslang"
          git -C "$RUNNER_TEMP/glslang" fetch -q --depth 1 https://github.com/KhronosGroup/glslang.git f0bd0257c308b9a26562c1a30c4748a0219cc951
          git -C "$RUNNER_TEMP/glslang" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/glslang" -B "$RUNNER_TEMP/glslang/build" -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DENABLE_HLSL=OFF -DBUILD_EXTERNAL=OFF >/dev/null
          cmake --build "$RUNNER_TEMP/glslang/build" --target glslang-standalone -j"$(nproc)" >/dev/null
          echo "SHADER_CORPUS_GLSLANG=$RUNNER_TEMP/glslang/build/StandAlone/glslang" >> "$GITHUB_ENV"

      - name: Load
        run: make check HAVE_LLVM=${{ matrix.llvm }}

      # Twice: the second finds the generated folder gone, and must still
      # succeed without an error from make
      - name: Clean
        run: |
          for i in 1 2; do make clean HAVE_LLVM=${{ matrix.llvm }} 2>&1 | tee clean.log; ! grep -q 'Error' clean.log; done
          test -z "$(find Utilities rpcs3/Emu -maxdepth 1 -name '*.o' | head -1)"
