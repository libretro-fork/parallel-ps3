# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

# Linux x64, Linux aarch64, Windows x64, Android arm64-v8a and x86_64, and
# macOS arm64 and x86_64.
#
# The buildbot's own Linux images are Ubuntu 16.04 with gcc 9, which cannot
# build RPCS3 at all, so the Linux jobs run in the images upstream RPCS3 builds
# its Linux releases in - the same ones the GitHub workflow uses - through the
# same script.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

.core-defs:
  # A failed job is run again: the nightly at 04:03 on 5 Oct failed in two jobs
  # only because GitHub turned the runner's anonymous clones away ("could not
  # read Username for 'https://github.com'") - the submodules on linux-x64,
  # protobuf's abseil on windows-x64 - while the same commit built the evening
  # before and the morning after.
  # The runner reuses its clone, and a submodule whose recorded commit is
  # already checked out there is skipped by a plain `submodule update` even
  # when its files are gone: the jobs on 6 Oct configured against an empty
  # 3rdparty/ffmpeg and SoundTouch. So the scripts update with --force.
  retry:
    max: 2
    when: script_failure
  variables:
    # The jobs fetch the submodules themselves, LLVM only where it is built.
    GIT_SUBMODULE_STRATEGY: none
    CORENAME: rpcs3
    EXTRA_PATH: rpcs3/libretro

# .gitmodules is upstream's, and upstream gives its submodules URLs relative to
# its own GitHub repository (../../asmjit/asmjit.git). Cloned from
# git.libretro.com those resolve to git.libretro.com/asmjit/asmjit.git, which
# does not exist, so point them back at GitHub before anything is fetched.
.submodule-urls: &submodule-urls
  - git config --global --add safe.directory '*'
  - sed -i 's#url = \.\./\.\./#url = https://github.com/#' .gitmodules
  - git submodule -q sync

.linux-defs:
  variables:
    COMPILER: clang
    RPCS3_DIR: $CI_PROJECT_DIR
    ARTDIR: $CI_PROJECT_DIR/artifacts
  before_script:
    - *submodule-urls
  script:
    - .ci/build-libretro.sh
    - mv artifacts/$LIBNAME $LIBNAME

# Inclusion templates, required for the build to work
include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

  # macOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-x86.yml'

stages:
  - build-prepare
  - build-shared

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs
    - .linux-defs
  image: rpcs3/rpcs3-ci-jammy:2.1

# Linux 64-bit (ARM)
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs
    - .linux-defs
  image: rpcs3/rpcs3-ci-jammy-aarch64:2.1

# Windows 64-bit
#
# Cross-built on Linux with llvm-mingw (clang, lld, libc++), the same kind of
# toolchain as the MSYS2 clang64 environment the GitHub workflow builds
# Windows in. The buildbot's own Windows images cannot build RPCS3: MXE's gcc
# is not a toolchain RPCS3 supports, and MSVC 2019 16.8 is too old for its C++.
# .ci/build-windows-cross-libretro.sh makes what clang64 would provide as
# packages (LLVM, GLEW, the Vulkan headers and import library).
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  # The template's own image (MXE, gcc 16) carries llvm-mingw in /opt
  # (20260826), the toolchain the script cross-builds with, so the job no
  # longer pulls mstorsjo/llvm-mingw from Docker Hub
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - export PATH=/opt/llvm-mingw/bin:$PATH
    - *submodule-urls
  script:
    - .ci/build-windows-cross-libretro.sh
    - mv build/bin/$LIBNAME $LIBNAME

# Android
#
# Nothing ships LLVM or ffmpeg for Android, so both are built here. LLVM comes
# from its submodule (3rdparty/llvm/CMakeLists.txt has the Android branch for
# it, which picks the AArch64 or the X86 backend) and cannot be left out: the
# CPU backends use llvm:: types whether or not WITH_LLVM is set. ffmpeg's
# prebuilts are for Windows, macOS and glibc Linux only, so it is cross-built
# from source with the NDK, and kept in the GitLab cache between pipelines.
.android-defs:
  variables:
    API_LEVEL: 30
    FFMPEG_PREFIX: $CI_PROJECT_DIR/ffmpeg-android
    CORE_ARGS: >-
      -DBUILD_LIBRETRO_CORE_ONLY=ON
      -DWITH_LLVM=ON
      -DBUILD_LLVM=ON
      -DUSE_NATIVE_INSTRUCTIONS=OFF
      -DUSE_PRECOMPILED_HEADERS=OFF
      -DUSE_SDL=OFF
      -DUSE_DISCORD_RPC=OFF
      -DUSE_LTO=OFF
      -DUSE_SYSTEM_OPENCV=OFF
      -DUSE_SYSTEM_SDL=OFF
      -DUSE_SYSTEM_OPENAL=OFF
      -DUSE_SYSTEM_FFMPEG=ON
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/ffmpeg-android
      -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
      -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - |
      if [ "$ANDROID_NDK_VERSION" = "27.3.13750724" ]; then
        export ANDROID_NDK_VERSION="29.0.14206865"
        export NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
      fi
    - *submodule-urls
    - git submodule -q update --init --force --depth 1 $(awk '/path/ { print $3 }' .gitmodules)
    - |
      TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
      if [ -f "$FFMPEG_PREFIX/lib/libavcodec.a" ]; then
        echo "ffmpeg from the cache"
      else
      git clone --quiet --depth 1 -b release/7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
      (cd ffmpeg-src && ./configure \
        --prefix="$FFMPEG_PREFIX" \
        --target-os=android --arch=$FFMPEG_ARCH --enable-cross-compile \
        --cc="$TC/$FFMPEG_TRIPLE${API_LEVEL}-clang" \
        --cxx="$TC/$FFMPEG_TRIPLE${API_LEVEL}-clang++" \
        --ar="$TC/llvm-ar" --ranlib="$TC/llvm-ranlib" \
        --nm="$TC/llvm-nm" --strip="$TC/llvm-strip" \
        --enable-static --disable-shared --enable-pic \
        --disable-programs --disable-doc --disable-avdevice --disable-network \
        $FFMPEG_EXTRA \
        && make -j"$(nproc)" && make install)
      fi
    - export PKG_CONFIG_LIBDIR="$FFMPEG_PREFIX/lib/pkgconfig"
  # The ffmpeg it builds does not change between pipelines; the key names
  # everything it depends on, so a change to any of them builds it afresh.
  cache:
    key: ffmpeg-7.1-android-$ANDROID_ABI-api30-ndk29-asm
    paths:
      - ffmpeg-android/

# Android 64-bit (ARM)
android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs
    - .android-defs
  variables:
    FFMPEG_ARCH: aarch64
    FFMPEG_TRIPLE: aarch64-linux-android
    FFMPEG_EXTRA: ""

# Android 64-bit (x86)
#
# ffmpeg's x86 assembly is built with nasm, which the Android image has had
# since October 2026.
android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .core-defs
    - .android-defs
  variables:
    FFMPEG_ARCH: x86_64
    FFMPEG_TRIPLE: x86_64-linux-android

# macOS
#
# The buildbot's Macs have Xcode, cmake, ninja and git, and no Homebrew, which
# the GitHub workflow takes LLVM, clang and MoltenVK from; and Xcode's clang
# does not build RPCS3. .ci/build-macos-libretro.sh builds LLVM and clang from
# the LLVM submodule and fetches MoltenVK's release instead; the cache keeps
# both between pipelines, so only the first one (or the first after the LLVM
# submodule moves) builds them, for an hour or more. The x86_64 slice is
# cross-built on Apple Silicon, as Cemu's is. Checked on GitHub's macOS 14
# runners first (.github/workflows/buildbot-preflight-macos.yml).
.core-defs-macos:
  extends: .core-defs
  allow_failure: true
  timeout: 4h
  before_script:
    # The template's before_script uses nproc, which a stock Mac does not
    # have; and the shared submodule-urls step runs GNU sed's -i
    - export NUMPROC=$(($(sysctl -n hw.ncpu)/5))
    - git config --global --add safe.directory '*'
    - sed -i '' 's#url = \.\./\.\./#url = https://github.com/#' .gitmodules
    - git submodule -q sync
  script:
    - .ci/build-macos-libretro.sh
  cache:
    key: llvm-clang-moltenvk-$CI_JOB_NAME
    paths:
      - deps-macos-arm64/
      - deps-macos-x86_64/
      - deps-macos-host/

# macOS 64-bit (Apple Silicon)
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs-macos
  variables:
    ARCH: arm64

# macOS 64-bit (Intel), cross-built on Apple Silicon
libretro-build-osx-x64:
  extends:
    # -x86_64, not -x86: the latter is the 32-bit profile and sets ARCH=x86.
    - .libretro-osx-cmake-x86_64
    - .core-defs-macos
  tags:
    - mac-apple-silicon
  variables:
    ARCH: x86_64
